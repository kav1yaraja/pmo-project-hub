                          =Patch(ActionItems, LookUp(ActionItems, ID = ThisItem.ID), {Status: "Done", CompletedOn: Today()}); ClearCollect(colPA, Filter(ActionItems, ProjectID = varProject.ID)); Notify("Marked done. Toggle it back to reopen.", NotificationType.Success)
                        OnUncheck: |-
                          =Patch(ActionItems, LookUp(ActionItems, ID = ThisItem.ID), {Status: "Open", CompletedOn: Blank()}); ClearCollect(colPA, Filter(ActionItems, ProjectID = varProject.ID)); Notify("Reopened.", NotificationType.Information)
